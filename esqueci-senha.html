<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar Senha - Culture</title>

 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d0d0d'/><ellipse cx='50' cy='22' rx='20' ry='7' fill='none' stroke='%230088ff' stroke-width='5'/><path d='M68 42 C 60 34, 38 32, 30 45 C 20 60, 30 80, 52 80 C 66 80, 72 72, 72 72' fill='none' stroke='%230088ff' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/><path d='M30 48 L28 58' stroke='%230088ff' stroke-width='4' stroke-linecap='round'/><path d='M68 76 L68 84' stroke='%230088ff' stroke-width='4' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="esqueci-senha.css" />
</head>
<body>

  <main class="forgot-card">
    <header class="forgot-header">
      <div class="logo-container" style="text-align: center; margin-bottom: 16px;">
        <img src="imagens/logo.png" alt="Logo Apex" style="max-width: 150px; height: auto; display: inline-block;" />
      </div>
      <h1>Recuperar Senha</h1>
      <p>Digite seu e-mail cadastrado para receber as instruções de redefinição.</p>
    </header>

    <div id="errorAlert" class="alert alert-error"></div>
    <div id="successAlert" class="alert alert-success"></div>

    <form id="forgotForm" novalidate>
      <div class="input-field">
        <label for="email">E-mail cadastrado</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input type="email" id="email" placeholder="seuemail@exemplo.com" required />
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Enviar Instruções</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>

    <footer class="forgot-footer">
      <p><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Voltar para o Login</a></p>
    </footer>
  </main>

  <script src="esqueci-senha.js"></script>
</body>
</html>
