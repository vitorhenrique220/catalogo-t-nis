<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | Loja de Tênis</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

   
    <header class="top-announcement-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;">
        <div class="announcement-text">
            <a href="index.html" style="color: #0088ff; text-decoration: none; font-size: 1.2rem;">LOJA DE TÊNIS</a>
        </div>
        
        
        <div id="nav-usuario"></div>
    </header>

    <main class="carrinho-container">
        <h1>Minha Conta</h1>

        <section class="sobre-nos-home" style="margin-bottom: 20px;">
            <h3>Dados Pessoais</h3>
            <div style="margin-top: 15px; line-height: 1.8;">
                <p><strong>Nome:</strong> <span id="user-nome">Carregando...</span></p>
                <p><strong>E-mail:</strong> <span id="user-email">Carregando...</span></p>
            </div>
        </section>

        <section class="sobre-nos-home">
            <h3>Ações</h3>
            <div style="margin-top: 15px; display: flex; gap: 15px;">
                <button id="btn-sair" class="btn-excluir-user" style="padding: 10px 20px; font-size: 1rem;">
                    Sair da Conta (Logout)
                </button>
            </div>
        </section>
    </main>

    <script src="header.js"></script>
    <script src="minha-conta.js"></script>
</body>
</html>
