<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <title>Culture - Login</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d0d0d'/><ellipse cx='50' cy='22' rx='20' ry='7' fill='none' stroke='%230088ff' stroke-width='5'/><path d='M68 42 C 60 34, 38 32, 30 45 C 20 60, 30 80, 52 80 C 66 80, 72 72, 72 72' fill='none' stroke='%230088ff' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/><path d='M30 48 L28 58' stroke='%230088ff' stroke-width='4' stroke-linecap='round'/><path d='M68 76 L68 84' stroke='%230088ff' stroke-width='4' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <main class="login-card">
    <header class="login-header">

       <div class="logo-container" style="text-align: center; margin-bottom: 16px;">
        <img src="imagens/logo.png" alt="Logo Apex" style="max-width: 150px; height: auto; display: inline-block;" />
      </div>
      
   
      <p>Entre com sua conta para acessar a loja.</p>
    </header>

    <div class="divider">
      <span>entre com o e-mail</span>
    </div>

    <div id="errorAlert" class="error-alert" style="display: none;"></div>

    <form id="loginForm" novalidate>
      <div class="input-field">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input type="email" id="email" placeholder="seuemail@exemplo.com" required />
        </div>
      </div>

      <div class="input-field">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="password" placeholder="••••••••" required />
          <button type="button" id="togglePassword" class="btn-toggle-pass" aria-label="Mostrar senha">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember" />
          <span>Lembrar de mim</span>
        </label>
        <a href="esqueci-senha.html" class="forgot-pass">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Entrar</span>
        <i class="fa-solid fa-table"></i>
      </button>
    </form>

    <footer class="login-footer">
      <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se grátis</a></p>
    </footer>
  </main>

  <script src="login.js"></script>

</body>
</html>
