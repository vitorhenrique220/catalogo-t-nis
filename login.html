<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  

  <title>Culture - Login</title>


  <link rel="icon" type="image/png" href="imagens/ChatGPT Image 28 de jul. de 2026, 15_02_54.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="login.css" />
</head>
<body>










    
  <main class="login-card">
    <header class="login-header">

      <div class="logo-container" style="text-align: center; margin-bottom: 16px;">
        <img src="imagens/ChatGPT Image 28 de jul. de 2026, 15_02_54.png" alt="" style="max-width: 140px; height: auto; display: inline-block;" />
      </div>
      <h1>Culture.CoO</h1>
      <p>Acesse seu painel de leitura de planilhas</p>
    </header>

    
    <div class="divider">
      <span>entre com o e-mail</span>
    </div>

    <div id="errorAlert" class="error-alert" style="display: none;"></div>

    <form id="loginForm" novalidate>
      <div class="input-field">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input type="email" id="email" placeholder="seuemail@exemplo.com" required />
        </div>
      </div>

      <div class="input-field">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="password" placeholder="••••••••" required />
          <button type="button" id="togglePassword" class="btn-toggle-pass" aria-label="Mostrar senha">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember" />
          <span>Lembrar de mim</span>
        </label>
        <a href="esqueci-senha.html" class="forgot-pass">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Acessar Sistema</span>
        <i class="fa-solid fa-table"></i>
      </button>
    </form>

    <footer class="login-footer">
      <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se grátis</a></p>
    </footer>
  </main>

  <script src="login.js"></script>

</body>
</html>
